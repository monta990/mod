name: UI Branding CI

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v12.0.0"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-branding-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            experimental: false
          - php: "8.4"
            experimental: false
          - php: "8.5"
            experimental: false
          - php: "8.6"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    name: Validate PHP ${{ matrix.php }}${{ matrix.experimental && ' (experimental)' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install artwork generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r mod/scripts/requirements-assets.txt

      - name: Generate plugin logo and sample resources
        run: |
          python mod/scripts/generate-assets.py mod
          python mod/scripts/test-logo-contrast.py

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring
          coverage: none

      - name: Show PHP runtime
        run: php -v

      - name: Verify repository layout
        run: |
          test -d mod
          unexpected="$(find . -maxdepth 1 -mindepth 1 ! -name '.github' ! -name '.git' ! -name 'mod' ! -name 'README.md' ! -name 'LICENSE' ! -name 'CHANGELOG.md' -print)"
          test -z "$unexpected"
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          cmp LICENSE mod/LICENSE.txt

      - name: PHP syntax
        run: |
          find mod/setup.php mod/hook.php mod/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l mod/scripts/validate-release.php
          php -l mod/scripts/test-upgrade-preservation.php

      - name: Test upgrade data preservation
        run: php mod/scripts/test-upgrade-preservation.php

      - name: Validate release metadata and folder layout
        run: php mod/scripts/validate-release.php

      - name: Validate gettext catalogs
        run: |
          for po in mod/locales/*.po; do
            msgfmt --check --check-format -o /tmp/catalog.mo "$po"
          done

      - name: Build release ZIP
        run: |
          bash mod/scripts/package.sh dist
          test -f dist/mod-12.0.0.zip
          test "$(unzip -Z1 dist/mod-12.0.0.zip | grep -c '^mod/')" -gt 0
          ! unzip -Z1 dist/mod-12.0.0.zip | grep -q '^mod/scripts/'
          ! unzip -Z1 dist/mod-12.0.0.zip | grep -q '^mod/\.git'

      - name: Upload release ZIP artifact
        if: matrix.php == '8.3' && !matrix.experimental
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-branding-12.0.0
          path: dist/mod-12.0.0.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v12.0.0')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install artwork generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r mod/scripts/requirements-assets.txt

      - name: Generate plugin logo and sample resources
        run: |
          python mod/scripts/generate-assets.py mod
          python mod/scripts/test-logo-contrast.py

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: fileinfo, mbstring
          coverage: none

      - name: Validate
        run: |
          find mod/setup.php mod/hook.php mod/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php mod/scripts/validate-release.php
          php mod/scripts/test-upgrade-preservation.php

      - name: Build release ZIP
        run: bash mod/scripts/package.sh dist

      - name: Publish ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mod-12.0.0.zip \
            --title "UI Branding 12.0.0" \
            --generate-notes \
            --verify-tag
