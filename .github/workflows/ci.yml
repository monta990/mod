name: UI Branding CI

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v12.0.0"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring
          coverage: none

      - name: PHP syntax
        run: |
          find setup.php hook.php src -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate release metadata
        run: php scripts/validate-release.php

      - name: Validate gettext catalogs
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          for po in locales/*.po; do
            msgfmt --check --check-format -o /tmp/catalog.mo "$po"
          done

      - name: Build release ZIP
        run: |
          bash scripts/package.sh dist
          test -f dist/mod-12.0.0.zip
          test "$(unzip -Z1 dist/mod-12.0.0.zip | grep -c '^mod/')" -gt 0
          ! unzip -Z1 dist/mod-12.0.0.zip | grep -q '^mod/\.git'

      - name: Upload release ZIP artifact
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: ui-branding-12.0.0
          path: dist/mod-12.0.0.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v12.0.0')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: fileinfo, mbstring
          coverage: none

      - name: Validate
        run: |
          find setup.php hook.php src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php scripts/validate-release.php

      - name: Build release ZIP
        run: bash scripts/package.sh dist

      - name: Publish ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: UI Branding 12.0.0
          files: dist/mod-12.0.0.zip
          generate_release_notes: true
